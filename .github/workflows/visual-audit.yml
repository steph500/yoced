name: Visual Audit

on:
  push:
    branches:
      - design-consistency

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Start app
        run: |
          npm start > /tmp/yoced-next.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/yoced-next.log
          exit 1
      - name: Capture and audit routes
        run: |
          mkdir -p visual-audit
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless: true});
          const routes = [
            ['home','/'],['programs','/programs'],['program-agriculture','/programs/agriculture-food-systems'],
            ['work','/work'],['ventures','/ventures'],['venture-casa','/ventures/casa-furnishings'],
            ['partners','/partners'],['about','/about'],['contact','/contact'],
            ['for-partners','/for/partners'],['for-funders','/for/funders']
          ];
          const failures = [];
          for (const [name, route] of routes) {
            for (const [device, width, height] of [['desktop',1440,1000],['mobile',390,844]]) {
              const page = await browser.newPage({viewport:{width,height}, deviceScaleFactor:1});
              await page.goto('http://127.0.0.1:3000'+route,{waitUntil:'networkidle'});
              await page.evaluate(() => document.fonts.ready);
              const textAudit = await page.evaluate(() => {
                const issues = [];
                for (const el of document.querySelectorAll('body *')) {
                  if (['SCRIPT','STYLE','NOSCRIPT','SVG','PATH'].includes(el.tagName)) continue;
                  const direct = [...el.childNodes].some(node => node.nodeType === Node.TEXT_NODE && node.textContent?.trim());
                  if (!direct) continue;
                  const cs = getComputedStyle(el);
                  if (cs.display === 'none' || cs.visibility === 'hidden' || Number(cs.opacity) === 0) continue;
                  const rect = el.getBoundingClientRect();
                  if (!rect.width || !rect.height) continue;
                  const size = parseFloat(cs.fontSize);
                  const family = cs.fontFamily;
                  const text = (el.textContent || '').trim().replace(/\s+/g,' ').slice(0,90);
                  if (!family.toLowerCase().includes('inter')) issues.push({kind:'font',tag:el.tagName,family,text});
                  if (size < 10) issues.push({kind:'size',tag:el.tagName,size,text});
                }
                return issues;
              });
              if (textAudit.length) failures.push({name,device,issues:textAudit.slice(0,30)});
              await page.screenshot({path:`visual-audit/${name}-${device}.png`,fullPage:true});
              await page.close();
            }
          }
          await browser.close();
          if (failures.length) {
            console.error(JSON.stringify(failures,null,2));
            process.exit(1);
          }
          console.log('Typography audit passed: all visible direct text uses Inter and no text is below 10px.');
          EOF
          node capture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yoced-visual-audit
          path: visual-audit/*.png
          if-no-files-found: error
          retention-days: 2
